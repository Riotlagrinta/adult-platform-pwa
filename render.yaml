services:
  - type: web
    name: onlyadults-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://onlyadults-frontend.vercel.app
      - key: DATABASE_URL
        sync: false # Saisir l'URL Neon de production dans le dashboard Render
      # ── Stockage Cloud Backblaze B2 (S3-Compatible) ──
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: S3_REGION
        value: us-east-005
      - key: S3_BUCKET_NAME
        value: Only-Adult
      # ── Web Push Notifications (VAPID) ──
      - key: VAPID_PUBLIC_KEY
        value: BHWr5CGnorng3gn5zwnN7wJ1inUUak_6u3lx7R06zT1twxM_VgGOzdcKEvmh3wan9NG_C-P9ZuBO9wBhFDCYRX8
      - key: VAPID_PRIVATE_KEY
        value: L08laroYvYGQ-Pf69Q96a1pEd4hdupTO_QtOBuSPSFc
      - key: VAPID_SUBJECT
        value: mailto:admin@onlyadults.com
