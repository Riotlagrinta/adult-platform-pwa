services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adult_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - adult_platform_db:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/adult_platform?schema=public
      PORT: 4000
      JWT_SECRET: change_me_now
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

volumes:
  adult_platform_db:
