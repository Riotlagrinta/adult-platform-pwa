name: 📱 Build & Release Android APK (OnlyAdults)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🔨 Compiler l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Installer et Configurer Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔐 Vérifier le Keystore de signature
        run: |
          if [ -f "android/keystore/release.jks" ]; then
            echo "Keystore de signature présent."
          else
            echo "Génération du Keystore de signature..."
            mkdir -p android/keystore
            keytool -genkeypair -v -keystore android/keystore/release.jks -alias onlyadults -keyalg RSA -keysize 2048 -validity 10000 -storepass onlyadults2026 -keypass onlyadults2026 -dname "CN=OnlyAdults, OU=Mobile, O=OnlyAdults Inc, L=Paris, ST=IDF, C=FR"
          fi

      - name: 🚀 Compiler l'APK Android (assembleRelease)
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: 📦 Préparer le fichier OnlyAdults.apk
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/OnlyAdults.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/OnlyAdults.apk
          fi
          ls -la output/

      - name: 📤 Téléverser l'Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: OnlyAdults-Android-APK
          path: output/OnlyAdults.apk
          retention-days: 30

      - name: 🏷️ Publier dans les Releases GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0"
          name: "📱 OnlyAdults Application Officielle Android (.APK)"
          body: |
            ### 🚀 OnlyAdults - Application Officielle Android (APK)

            Fichier binaire officiel avec mises à jour automatiques en temps réel.
            
            #### 📲 Installation :
            1. Téléchargez le fichier **`OnlyAdults.apk`** ci-dessous.
            2. Ouvrez le fichier et autorisez l'installation des applications inconnues si demandé.
            3. Profitez de l'expérience plein écran et des notifications privées.
          files: output/OnlyAdults.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
