name: 🍏 Build iOS IPA Executable (OnlyAdults)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🍎 Compiler le binaire iOS avec Xcode
    runs-on: macos-14

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installer les dépendances frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx cap sync ios

      - name: 🔨 Compiler le projet Xcode en Archive iOS
        working-directory: frontend/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r OnlyAdults.ipa Payload/

      - name: 📤 Téléverser l'IPA binaire compilé
        uses: actions/upload-artifact@v4
        with:
          name: OnlyAdults-iOS-Compiled-IPA
          path: frontend/ios/App/OnlyAdults.ipa
          retention-days: 30

      - name: 🏷️ Mettre à jour la Release GitHub
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef299c7d870e # v2.2.1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0"
          name: "📱 OnlyAdults Application Officielle (APK & IPA)"
          files: frontend/ios/App/OnlyAdults.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
